name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest tests/ -q

      - name: Every agent definition loads and validates
        run: python -m colorteam list

      - name: The linter catches the seeded defects
        # The sample draft is written to fail. A zero exit here would mean the
        # rules stopped firing, so the expected result is a non-zero exit.
        run: |
          if python -m colorteam lint examples/sample-draft.md > /dev/null; then
            echo "::error::sample-draft.md was expected to fail the gate"
            exit 1
          fi

      - name: The revised draft passes the gate
        run: python -m colorteam lint examples/sample-draft-revised.md

      - name: Word documents lint identically to their text
        run: python -m colorteam lint examples/sample-draft.docx > /dev/null || true

      - name: The knowledge base scaffolds cleanly
        run: python -m colorteam knowledge init

      - name: The Claude Project pack matches its sources
        # The pack is generated from agents/ and reference/. If it drifts, the
        # no-install version runs prompts that are not the ones under test.
        run: python -m colorteam project check

      - name: The matrix round trips through a workbook
        run: |
          python -m colorteam matrix convert examples/sample-matrix.md -o /tmp/m.json
          python -m colorteam matrix export /tmp/m.json -o /tmp/m.xlsx
          python -m colorteam matrix import /tmp/m.xlsx -o /tmp/m2.json --against /tmp/m.json

      - name: The coverage gate holds a draft that misses a requirement
        run: |
          printf '## 2.1 Only section\n\nText.\n' > /tmp/thin.md
          if python -m colorteam coverage --matrix /tmp/m.json --draft /tmp/thin.md; then
            echo "::error::the gate should have held a draft missing requirements"
            exit 1
          fi

      - name: The assembled document carries its appendices
        run: |
          python -m colorteam assemble --draft examples/sample-draft-revised.md \
                 --matrix /tmp/m.json -o /tmp/proposal.docx
          test -f /tmp/proposal.docx

      - name: Figures extract and render from a draft
        run: |
          python -m colorteam graphics examples/sample-graphics.md --out /tmp/gfx
          test -f /tmp/gfx/graphics.html
